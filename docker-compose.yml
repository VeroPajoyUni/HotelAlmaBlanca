# Nombre propio del proyecto: evita compartir volúmenes con otra carpeta llamada igual
name: hotel-alma-blanca

services:

  home:
    build: ./home
    ports:
      - "3000:80"
      
  api-gateway:
    image: node:alpine
    command: sh -c "echo 'API Gateway (pendiente de implementar)' && sleep infinity"
    
  usuarios-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USUARIOS_DB_NAME}
      POSTGRES_USER: ${USUARIOS_DB_USER}
      POSTGRES_PASSWORD: ${USUARIOS_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - usuarios_data:/var/lib/postgresql/data
    
  usuarios:
    build: ./servicios/usuarios
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - usuarios-db
      
  habitaciones-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${HABITACIONES_DB_NAME}
      POSTGRES_USER: ${HABITACIONES_DB_USER}
      POSTGRES_PASSWORD: ${HABITACIONES_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - habitaciones_data:/var/lib/postgresql/data
    
  habitaciones:
    build: ./servicios/habitaciones
    ports:
      - "5003:5000"
    env_file:
      - .env
    depends_on:
      - habitaciones-db
      
  reservas-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RESERVAS_DB_NAME}
      POSTGRES_USER: ${RESERVAS_DB_USER}
      POSTGRES_PASSWORD: ${RESERVAS_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - reservas_data:/var/lib/postgresql/data
    
  reservas:
    build: ./servicios/reservas
    ports:
      - "5002:5000"
    env_file:
      - .env
    depends_on:
      - reservas-db
      
  pagos-db:
    image: postgres:alpine
    command: sh -c "echo 'Base de datos de Pagos (pendiente)' && sleep infinity"
    # Al implementar Pagos, reemplazar el comando por la configuración:
    # environment:
    #   POSTGRES_DB: ${PAGOS_DB_NAME}
    #   POSTGRES_USER: ${PAGOS_DB_USER}
    #   POSTGRES_PASSWORD: ${PAGOS_DB_PASSWORD}
    # ports:
    #   - "5436:5432"
    # volumes:
    #   - pagos_data:/var/lib/postgresql/data
    
  pagos:
    image: node:alpine
    command: sh -c "echo 'Servicio Pagos (pendiente de implementar)' && sleep infinity"
    depends_on:
      - pagos-db
    # Al implementar el servicio, agregar:
    # env_file:
    #   - .env
      
  notificaciones-db:
    image: redis:alpine
    command: sh -c "echo 'Base de datos de Notificaciones (pendiente)' && sleep infinity"
    # Al implementar Notificaciones, configurar su conexión con:
    # NOTIFICACIONES_DB_HOST y NOTIFICACIONES_DB_PORT en .env
    # ports:
    #   - "5437:6379"
    
  notificaciones:
    image: node:alpine
    command: sh -c "echo 'Servicio Notificaciones (pendiente de implementar)' && sleep infinity"
    depends_on:
      - notificaciones-db
    # Al implementar el servicio, agregar:
    # env_file:
    #   - .env

volumes:
  reservas_data:
  usuarios_data:
  habitaciones_data:
  # pagos_data:
